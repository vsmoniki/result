<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <meta name="googlebot" content="noindex, nofollow, noarchive" />
    <title>Zwift Result Image Maker</title>
    <link rel="stylesheet" href="./src/styles.css" />
  </head>
  <body>
    <div id="app">
      <main class="shell">
        <section class="hero">
          <p class="eyebrow">FITファイルからPNG生成</p>
          <h1>Zwift風リザルト画像メーカー</h1>
          <p>FITファイルをブラウザ内で解析し、完走タイム画面またはライドレポート画面を生成します。</p>
        </section>

        <section class="panel controls">
          <div id="fileDrop" class="file-drop" aria-describedby="status">
            <span>.fitを選択</span>
            <strong id="fileName">未選択</strong>
            <small>タップまたはドロップ</small>
            <input
              id="fitFile"
              class="file-input"
              type="file"
              accept=".fit,.FIT,application/vnd.ant.fit,application/octet-stream"
            />
          </div>

          <div class="mode-grid" role="tablist" aria-label="作成する画像タイプ">
            <label><input type="radio" name="mode" value="report" checked /> ライドレポート</label>
            <label><input type="radio" name="mode" value="finish" /> 完走タイム</label>
          </div>

          <div id="reportInputs" class="form-grid">
            <label class="ride-title-field">ライドタイトル<input id="rideTitle" type="text" required /></label>
            <label>FTP（W）<input id="ftp" type="number" min="1" step="1" required /></label>
            <label>最大心拍数（bpm）<input id="maxHrSetting" type="number" min="80" step="1" required /></label>
            <label>SP<input id="spInput" type="number" min="0" step="1" /></label>
            <label>レベル<input id="level" type="number" min="1" max="999" step="1" value="100" required /></label>
          </div>

          <div id="finishInputs" class="form-grid hidden">
            <label>体重（kg）<input id="weight" type="number" min="20" step="0.1" required /></label>
          </div>

          <div class="actions">
            <button id="generate" type="button">画像を作成</button>
            <a id="download" class="download disabled" download="zwift-result.png">PNGを保存</a>
          </div>
          <p id="status" class="status">FITファイルを選択してください。</p>
        </section>

        <section class="panel preview-panel">
          <div class="preview-toolbar">
            <h2>プレビュー</h2>
            <span id="summary"></span>
          </div>
          <canvas id="canvas" width="1920" height="1080" aria-label="生成画像プレビュー"></canvas>
          <details class="preview-options">
            <summary>オプション</summary>
            <div class="graph-smoothness-control">
              <div class="graph-smoothness-header">
                <label for="graphSmoothness">グラフの平準化</label>
                <strong id="graphSmoothnessValue">0%</strong>
              </div>
              <input id="graphSmoothness" type="range" min="0" max="100" step="1" value="0" />
              <div class="graph-smoothness-footer">
                <span>細かい</span>
                <span>平準化</span>
              </div>
            </div>
          </details>
        </section>
      </main>
      <footer class="support-footer">
        <a href="https://buymeacoffee.com/monikilab" target="_blank" rel="noopener noreferrer">Buy me a coffee</a>
      </footer>
    </div>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
