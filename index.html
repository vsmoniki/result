<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <meta name="googlebot" content="noindex, nofollow, noarchive" />
    <title>Zwift Result Image Maker</title>

    <!-- Open Graph (Discord / Facebook / LINE など) -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://vsmoniki.github.io/result/" />
    <meta property="og:title" content="Zwift風リザルト画像メーカー" />
    <meta property="og:description" content="FITファイルをブラウザ内で解析し、Zwiftスタイルの完走タイム・ライドレポート画像をPNGで生成できる無料ツール。" />
    <meta property="og:image" content="https://vsmoniki.github.io/result/ogp.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="ja_JP" />
    <meta property="og:site_name" content="Zwift Result Image Maker" />

    <!-- Twitter Card (X) -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Zwift風リザルト画像メーカー" />
    <meta name="twitter:description" content="FITファイルをブラウザ内で解析し、Zwiftスタイルの完走タイム・ライドレポート画像をPNGで生成できる無料ツール。" />
    <meta name="twitter:image" content="https://vsmoniki.github.io/result/ogp.png" />
    <link rel="stylesheet" href="./src/styles.css" />
  </head>
  <body>
    <div id="app">
      <main class="shell">
        <section class="hero">
          <p class="eyebrow">FITファイル・FTP更新からPNG生成</p>
          <h1>Zwift風リザルト画像メーカー</h1>
          <p>FITファイルをブラウザ内で解析し、完走タイム画面・ライドレポート画面・FTP更新画面を生成します。</p>
        </section>

        <section class="panel controls">
          <div id="fileDrop" class="file-drop" aria-describedby="status">
            <span>.fitを選択</span>
            <strong id="fileName">未選択</strong>
            <small>タップまたはドロップ</small>
            <input
              id="fitFile"
              class="file-input"
              type="file"
              accept=".fit,.FIT,application/vnd.ant.fit,application/octet-stream"
            />
          </div>

          <div class="mode-grid" role="tablist" aria-label="作成する画像タイプ">
            <label><input type="radio" name="mode" value="report" checked /> ライドレポート</label>
            <label><input type="radio" name="mode" value="finish" /> 完走タイム</label>
            <label><input type="radio" name="mode" value="ftp-update" /> FTP更新</label>
          </div>

          <div id="reportInputs" class="form-grid">
            <label class="ride-title-field">ライドタイトル<input id="rideTitle" type="text" required /></label>
            <label class="avatar-message-field">右上の吹き出し<input id="avatarMessage" type="text" maxlength="12" value="GO!" /></label>
            <label class="avatar-image-field">プロフィール画像<input id="avatarImageFile" type="file" accept="image/*" /></label>
            <label>FTP（W）<input id="ftp" type="number" min="1" step="1" required /></label>
            <label>最大心拍数（bpm）<input id="maxHrSetting" type="number" min="80" step="1" required /></label>
            <label>SP<input id="spInput" type="number" min="0" step="1" /></label>
            <label>レベル<input id="level" type="number" min="1" max="999" step="1" value="100" required /></label>
          </div>

          <div id="finishInputs" class="form-grid hidden">
            <label>体重（kg）<input id="weight" type="number" min="20" step="0.1" required /></label>
          </div>

          <div id="ftpUpdateInputs" class="form-grid hidden">
            <label>元々のFTP（W）<input id="previousFtp" type="number" min="1" step="1" value="246" required /></label>
            <label>更新後のFTP（W）<input id="updatedFtp" type="number" min="1" step="1" value="247" required /></label>
          </div>

          <div class="actions">
            <button id="generate" type="button">画像を作成</button>
            <a id="download" class="download disabled" download="zwift-result.png">PNGを保存</a>
          </div>
          <p id="status" class="status">FITファイルを選択してください。</p>
        </section>

        <section class="panel preview-panel">
          <div class="preview-toolbar">
            <h2>プレビュー</h2>
            <span id="summary"></span>
          </div>
          <canvas id="canvas" width="1920" height="1080" aria-label="生成画像プレビュー"></canvas>
          <details class="preview-options">
            <summary>オプション</summary>
            <div class="option-slider-control power-graph-height-control">
              <div class="option-slider-header">
                <label for="powerGraphHeight">パワーメイングラフの高さ</label>
                <strong id="powerGraphHeightValue">0%</strong>
              </div>
              <input id="powerGraphHeight" type="range" min="-50" max="50" step="1" value="0" />
              <div class="option-slider-footer">
                <span>低い</span>
                <span>標準</span>
                <span>高い</span>
              </div>
            </div>
            <div class="option-slider-control graph-line-width-control">
              <div class="option-slider-header">
                <label for="graphLineWidth">グラフ白線の太さ</label>
                <strong id="graphLineWidthValue">0%</strong>
              </div>
              <input id="graphLineWidth" type="range" min="-100" max="100" step="1" value="0" />
              <div class="option-slider-footer">
                <span>細い</span>
                <span>太い</span>
              </div>
            </div>
            <div class="option-slider-control graph-smoothness-control">
              <div class="graph-smoothness-header">
                <label for="graphSmoothness">グラフの平準化</label>
                <strong id="graphSmoothnessValue">0%</strong>
              </div>
              <input id="graphSmoothness" type="range" min="-20" max="100" step="1" value="0" />
              <div class="graph-smoothness-footer">
                <span class="graph-smoothness-default-label">標準</span>
                <span class="graph-smoothness-high-label">平準化</span>
              </div>
            </div>
            <div class="option-reset-row">
              <button id="resetOptions" class="option-reset-button" type="button">オプションをデフォルト値に戻す</button>
            </div>
          </details>
        </section>
      </main>
      <footer class="support-footer">
        <a class="support-link" href="https://buymeacoffee.com/monikilab" target="_blank" rel="noopener noreferrer" aria-label="Buy me a coffeeでMonikiをサポートする">
          <span class="support-link__icon" aria-hidden="true">☕</span>
          <span class="support-link__text">
            <span class="support-link__label">Monikiをサポートする</span>
            <span class="support-link__service">Buy me a coffee</span>
          </span>
        </a>
      </footer>
    </div>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
